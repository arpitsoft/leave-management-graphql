<h2 mat-dialog-title>Add Staff Member</h2>

<mat-dialog-content>

    <div class="container-fluid">
        <form [formGroup]="form" (ngSubmit)="submit()">

            <div class="row g-3">

                <!-- Full Name -->
                <div class="col-12 col-md-6">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Full Name</mat-label>
                        <input matInput formControlName="name">
                    </mat-form-field>
                </div>

                <!-- Username -->
                <div class="col-12 col-md-6">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Username</mat-label>
                        <input matInput formControlName="username">
                    </mat-form-field>
                </div>

                <!-- Email -->
                <div class="col-12">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Email</mat-label>
                        <input matInput formControlName="email">
                    </mat-form-field>
                </div>

                <!-- Contact -->
                <div class="col-12 col-md-6">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Contact Number</mat-label>
                        <input matInput formControlName="contact">
                    </mat-form-field>
                </div>

                <div class="col-12 col-md-6">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Department</mat-label>
                        <input matInput formControlName="department">
                    </mat-form-field>
                </div>

                <!-- Role (fixed to STAFF) -->
                <div class="col-12">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Role</mat-label>
                        <input matInput value="STAFF" disabled>
                    </mat-form-field>
                </div>

                <!-- Password -->
                <div class="col-12">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Password</mat-label>
                        <input matInput [type]="showPassword ? 'text' : 'password'" formControlName="password">
                        <button mat-icon-button matSuffix type="button" (click)="togglePassword()">
                            <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                        </button>
                    </mat-form-field>
                </div>


                <div class="col-12">
                    <label for="profile_image" class="form-label">Profile Image</label>
                    <input id="profile_image" type="file" accept="image/*" (change)="onFileSelected($event)"
                        class="form-control">

                    <div *ngIf="previewUrl" class="mt-2 text-center">
                        <img [src]="previewUrl" class="img-thumbnail" style="max-width:150px;">
                    </div>
                </div>


                <!-- Submit -->
                <div class="col-12">
                    <button mat-raised-button color="primary" class="w-100">
                        Add Staff
                    </button>
                </div>

            </div>

        </form>
    </div>

</mat-dialog-content>
