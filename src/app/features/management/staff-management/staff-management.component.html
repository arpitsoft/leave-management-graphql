<div class="staff-container">

    <h2>Staff Management</h2>
    <div class="header">
        <div class="col-4">
            <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Search</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Search staff by name, username, email..." />
            </mat-form-field>
        </div>
        <button mat-raised-button color="primary" (click)="addStaff()">
            Add Staff
        </button>
    </div>

    <table mat-table [dataSource]="dataSource"  matSort class="mat-elevation-z3 full-width">
        <ng-container matColumnDef="fullName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Full Name </th>
            <td mat-cell *matCellDef="let staff"> {{ staff.name }} </td>
        </ng-container>

        <ng-container matColumnDef="username">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Username </th>
            <td mat-cell *matCellDef="let staff"> {{ staff.username }} </td>
        </ng-container>

        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
            <td mat-cell *matCellDef="let staff"> {{ staff.email }} </td>
        </ng-container>

        <ng-container matColumnDef="department">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Department </th>
            <td mat-cell *matCellDef="let staff"> {{ staff.department }} </td>
        </ng-container>


        <ng-container matColumnDef="contact">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Mobile </th>
            <td mat-cell *matCellDef="let staff"> {{ staff.contact }} </td>
        </ng-container>

        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef> Action </th>
            <td mat-cell *matCellDef="let staff" class="action-cell" >
                <button mat-button color="primary" (click)="viewStaff(staff)">View</button>
                <button mat-button color="warn" (click)="deleteStaff(staff.id!)">Delete</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="headers"></tr>
        <tr mat-row *matRowDef="let row; columns: headers"></tr>

    </table>

    <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>


</div>
