<h2 mat-dialog-title class="dialog-title">
    {{ data ? 'Edit Notification' : 'Create Notification' }}
</h2>

<div mat-dialog-content class="dialog-body">

    <form [formGroup]="form" class="form">

        <!-- Name -->
        <mat-form-field appearance="outline" class="full-width mb-3">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" />
        </mat-form-field>

        <!-- Description -->
        <mat-form-field appearance="outline" class="full-width mb-2">
            <mat-label>Description</mat-label>
            <textarea matInput rows="4" formControlName="description"></textarea>
        </mat-form-field>

    </form>
</div>

<div mat-dialog-actions class="dialog-actions">

    <button mat-stroked-button color="warn" (click)="dialogRef.close()">
        Cancel
    </button>

    <button mat-raised-button color="primary" (click)="save()">
        {{ data ? 'Update' : 'Save' }}
    </button>

</div>
