<div class="popup-container p-3">
  <h4 class="mb-3 text-center">Apply for Leave</h4>

  <form [formGroup]="leaveForm" (ngSubmit)="submitLeaveForm()">
    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>From Date</mat-label>
      <input matInput 
             [matDatepicker]="fromPicker" 
             formControlName="leaveFrom" 
             [min]="minDate">
      <mat-datepicker-toggle matSuffix [for]="fromPicker"></mat-datepicker-toggle>
      <mat-datepicker #fromPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>To Date</mat-label>
      <input matInput 
             [matDatepicker]="toPicker" 
             formControlName="leaveTo" 
             [min]="minDate">
      <mat-datepicker-toggle matSuffix [for]="toPicker"></mat-datepicker-toggle>
      <mat-datepicker #toPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Reason</mat-label>
      <textarea matInput rows="3" formControlName="reason"></textarea>
    </mat-form-field>

    <div class="d-flex justify-content-end">
      <button mat-button type="button" (click)="closeDialog()">Cancel</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="leaveForm.invalid">Apply</button>
    </div>
  </form>
</div>
