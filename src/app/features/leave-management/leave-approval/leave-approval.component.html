<div class="staff-container w-100">
  <div class="header d-flex justify-content-between align-items-center mb-4">
    <h2>Leave Approvals (HOD)</h2>
  </div>

  <div class="col-4">

    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Search</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Search" />
    </mat-form-field>
  </div>

  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z3 w-100">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>#</th>
      <td mat-cell *matCellDef="let leave; let i = index">{{ i + 1 }}</td>
    </ng-container>
    <ng-container matColumnDef="staffName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Staff Name</th>
      <td mat-cell *matCellDef="let leave">{{ leave.staffName }}</td>
    </ng-container>

    <ng-container matColumnDef="fromDate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>From Date</th>
      <td mat-cell *matCellDef="let leave">{{ leave.fromDate | date:'dd-MM-yyyy' }}</td>
    </ng-container>
    <ng-container matColumnDef="toDate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>To Date</th>
      <td mat-cell *matCellDef="let leave">{{ leave.toDate | date:'dd-MM-yyyy' }}</td>
    </ng-container>

    <ng-container matColumnDef="days">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Number of Days</th>
      <td mat-cell *matCellDef="let leave">{{ leave.fromDate | calculateDate: leave.toDate }}</td>
    </ng-container>

    <ng-container matColumnDef="reason">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Reason</th>
      <td mat-cell *matCellDef="let leave">{{ leave.reason }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let leave">
        <span class="badge" [ngClass]="{
                'bg-warning text-dark': leave.status==='Pending',
                'bg-success': leave.status==='Approved',
                'bg-danger': leave.status==='Rejected'
              }">
          {{ leave.status }}
        </span>
      </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let leave" class="d-flex gap-2">
        <button mat-raised-button color="success" *ngIf="leave.status==='Pending'" (click)="approveLeave(leave.id)">
          Approve
        </button>
        <button mat-raised-button color="warn" *ngIf="leave.status==='Pending'" (click)="rejectLeave(leave.id)">
          Reject
        </button>
        <button mat-stroked-button color="primary" *ngIf="leave.status==='Approved'" disabled>Approved</button>
        <button mat-stroked-button color="danger" *ngIf="leave.status==='Rejected'" disabled>Rejected</button>
      </td>
    </ng-container>

    <!-- Header & Row -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <!-- Paginator -->
  <mat-paginator [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 20]" [length]="dataSource.data.length"
    (page)="onPageChange($event)">
  </mat-paginator>
</div>
