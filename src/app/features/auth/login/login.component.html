<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <mat-card class="p-4" style="max-width:400px; width:100%;">
    <h2 class="text-center mb-3">Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <mat-form-field appearance="outline" class="w-100 mb-3">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username">
        <mat-error *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
          Username is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100 mb-3">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password">
        <mat-error *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password is required
        </mat-error>
      </mat-form-field>

      <div *ngIf="errorMessage" class="text-danger mb-3 text-center">
        {{ errorMessage }}
      </div>

      <button mat-raised-button color="primary" class="w-100" [disabled]="loading()">
        {{ loading() ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <div class="text-center mt-3">
      <p>Don't have an account? <a routerLink="/register">Register</a></p>
    </div>
  </mat-card>
</div>
